[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-image-to-cash"
version = "0.1.0"
description = "Turns an order image into a saved, verified Order and linked Invoice in Fakturama."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "psutil>=5.9",
    'uiautomation>=2.0.20 ; sys_platform == "win32"',
    'comtypes>=1.4 ; sys_platform == "win32"',
    'pywin32>=306 ; sys_platform == "win32"',
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0"]

[project.scripts]
fakturama-automation = "fakturama_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
